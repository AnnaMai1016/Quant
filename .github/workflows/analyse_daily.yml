name: AnalyseAgent daily dashboard

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 22:30 UTC = 17:30 EST / 18:30 EDT, after the US close (holidays auto-skipped)
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma list (overrides watchlist). NOTE: inputs are visible in this public repo.'
        required: false
      models:
        description: 'Optional comma list: claude,deepseek,gemini'
        required: false
      force:
        description: 'Run even if the market was closed today'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: analyse-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'   # keeps tickers/ratings out of the (public) logs
    steps:
      - name: Checkout code (public)
        uses: actions/checkout@v4

      - name: Checkout private history repo
        uses: actions/checkout@v4
        with:
          repository: AnnaMai1016/Quant-history
          token: ${{ secrets.HISTORY_REPO_TOKEN }}
          path: history-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AnalyseAgent/requirements.txt

      - run: pip install -r AnalyseAgent/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily dashboard
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          IN_TICKERS: ${{ inputs.tickers }}
          IN_MODELS: ${{ inputs.models }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          ARGS="--history-dir history-repo"
          [ -n "$IN_TICKERS" ] && ARGS="$ARGS --tickers $IN_TICKERS"
          [ -n "$IN_MODELS" ] && ARGS="$ARGS --models $IN_MODELS"
          [ "$IN_FORCE" = "true" ] && ARGS="$ARGS --force"
          python AnalyseAgent/run_daily.py $ARGS

      - name: Commit results to Quant-history
        if: always()
        working-directory: history-repo
        run: |
          git config user.name  "analyse-agent[bot]"
          git config user.email "analyse-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "daily $(date -u +%F)"
          git push -q
